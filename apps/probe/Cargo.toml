[package]
name = "Bifrost-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
sysinfo = "0.39.5"
serde = { version = "1.0.228", features = ["derive"] }
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "process"] }
reqwest = { version = "0.13.4", features = ["json"] }
