spring:
  application:
    name: bifrost
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
